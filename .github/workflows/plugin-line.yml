name: Plugin line

# A line is exactly its upstream commit + plugin-core, both pinned in
# enginehost/line.json (mytop-project/tracker#324). The check lives once, in
# mytop-project/droidtop-platforms, pinned by commit; tool-ref names the same commit.
on:
  push:
    branches: [plugin-core, "plugin/**"]

permissions:
  contents: read

jobs:
  line:
    uses: mytop-project/droidtop-platforms/.github/workflows/plugin-line-check.yml@0d931db42f484004b9ca7438500b725f60f2e3fc
    with:
      tool-ref: c06bcd29e474718898a02f293d2259b17553d900
